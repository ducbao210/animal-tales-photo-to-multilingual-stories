
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-story-pipeline"
version = "0.1.0"
description = "One-command animal character and multilingual story pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "numpy>=1.23,<2",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers>=4.44",
    "huggingface-hub>0.25",
    "accelerate>=0.30",
    "einops>=0.8",
    "timm>=1.0",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "kornia>=0.7",
    "tqdm>=4.65",
    "prettytable>=3.9",
    "speciesnet",
    "onnx==1.19.0",
    "ml-dtypes==0.5.3",
    "clip @ git+https://github.com/openai/CLIP.git",
    "google-genai>=2.0,<3",
    "replicate>=1.0,<2",
    "groq>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dataset = ["kagglehub>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "src*",
    "src.animal_scan*",
    "src.character_generation*",
    "src.story_generation*",
    "src.translation*",
    "src.utils*",
]
namespaces = true

[tool.setuptools.package-data]
"src.prompts" = [
    "part_b/*.md",
    "part_c/*.md",
    "part_d/*.md",
    "features/context_images/*.md",
]

# uv installs CUDA-enabled PyTorch.
# pip ignores these uv-specific settings.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
